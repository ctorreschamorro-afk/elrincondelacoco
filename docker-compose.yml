services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15
    container_name: supermarket_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supermercado
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - supermarket_net

  # Caché Redis
  redis:
    image: redis:7-alpine
    container_name: supermarket_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - supermarket_net

  # Almacenamiento compatible S3 (MinIO por Bitnami)
  minio:
    image: adobe/s3mock:latest
    container_name: supermarket_minio
    restart: always
    ports:
      - "9000:9090"
      - "9001:9091"
    environment:
      initialBuckets: supermarket-assets
    volumes:
      - minio_data:/data
    networks:
      - supermarket_net

  # Backend Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supermarket_backend
    restart: always
    command: sh -c "npx medusa build || true && npm run start"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/supermercado?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecret
      - COOKIE_SECRET=supersecret
      - FILE_PROVIDER=local
      - MEDUSA_FILE_PROVIDER=local
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - supermarket_net

  # Frontend Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supermarket_frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    command: npm run start
    networks:
      - supermarket_net

  # Proxy NGINX
  nginx:
    image: nginx:alpine
    container_name: supermarket_nginx
    restart: always
    ports:
      - "80:80"       # <--- NGINX se queda exclusivamente con el puerto 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - supermarket_net

networks:
  supermarket_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data: