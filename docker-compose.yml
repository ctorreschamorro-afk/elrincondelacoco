services:
  # Caché Redis
  redis:
    image: redis:7-alpine
    container_name: supermarket_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - supermarket_net

  # Almacenamiento compatible S3
  minio:
    image: adobe/s3mock:latest
    container_name: supermarket_minio
    restart: always
    ports:
      - "9000:9090"
      - "9001:9091"
    environment:
      initialBuckets: supermarket-assets
    volumes:
      - minio_data:/data
    networks:
      - supermarket_net

  # Backend Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supermarket_backend
    restart: always
    # Este nuevo comando instala TypeScript, migra la BD, compila y arranca
    command: sh -c "npm install typescript && npx medusa db:migrate && npx medusa build && npm run start"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecret
      - COOKIE_SECRET=supersecret
      - FILE_PROVIDER=local
      - MEDUSA_FILE_PROVIDER=local
    depends_on:
      - redis
      - minio
    networks:
      - supermarket_net

  # Frontend Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supermarket_frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - supermarket_net

  # Proxy NGINX
  nginx:
    image: nginx:alpine
    container_name: supermarket_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - supermarket_net

networks:
  supermarket_net:
    driver: bridge

volumes:
  minio_data:
  redis_data: